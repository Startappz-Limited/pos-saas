# Continuous integration (stage 0 of the SaaS conversion, docs/saas/).
#
#   sqlite              Pint and the full suite on SQLite.
#   mysql               The full suite on MySQL 8, including the flat API contract
#                       (tests/Fixtures/api-contract) and the live-like dataset tests.
#   migration-rehearsal Builds the live-like dataset with the base branch's code, then
#                       runs this branch's migrations on it and checks no table lost
#                       rows. Against a pre-SaaS base (the stage 1a PR) it instead checks
#                       the baseline refuses that database and imports it.
#
# Needs the repository secret COMPOSER_AUTH (Settings → Secrets and variables →
# Actions) to install the private startappz/wa-gateway-laravel package:
#   {"github-oauth":{"github.com":"<token with read access to wa-gateway-laravel>"}}

name: CI

# Needs one repository secret, COMPOSER_GITHUB_TOKEN: a GitHub token (only the token string, not
# JSON) with read access to the private startappz/wa-gateway-laravel repository. Composer receives it
# through COMPOSER_AUTH, which each install step builds below.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  PHP_EXTENSIONS: mbstring, pdo_sqlite, pdo_mysql, zip, gd, intl, bcmath, sodium
  # Nothing in CI uses the database for cache, sessions or queues.
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  # The MySQL service below (tests, rehearsal and dataset databases).
  DB_TEST_HOST: 127.0.0.1
  DB_TEST_PORT: 3306
  DB_TEST_USERNAME: root
  DB_TEST_PASSWORD: root

jobs:
  sqlite:
    name: Pint and suite (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Check the COMPOSER_GITHUB_TOKEN secret
        env:
          TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the repository secret COMPOSER_GITHUB_TOKEN (the token only, not JSON) so Composer can install the private wa-gateway-laravel package."
            exit 1
          fi
          case "$TOKEN" in
            *'{'*|*'"'*|*' '*)
              echo "::error::COMPOSER_GITHUB_TOKEN must contain only the token (ghp_... or github_pat_...), with no JSON, quotes or spaces."
              exit 1 ;;
          esac

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.COMPOSER_GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Only the files this branch changes: 123 files already on main predate
      # Pint, and reformatting them all would bury every change in noise.
      - name: Pint (changed files)
        run: vendor/bin/pint --test --diff="origin/${{ github.base_ref || 'main' }}"

      - name: Test suite (SQLite)
        run: php artisan test --compact

  mysql:
    name: Suite and API contract (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pos_saas_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Check the COMPOSER_GITHUB_TOKEN secret
        env:
          TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the repository secret COMPOSER_GITHUB_TOKEN (the token only, not JSON) so Composer can install the private wa-gateway-laravel package."
            exit 1
          fi
          case "$TOKEN" in
            *'{'*|*'"'*|*' '*)
              echo "::error::COMPOSER_GITHUB_TOKEN must contain only the token (ghp_... or github_pat_...), with no JSON, quotes or spaces."
              exit 1 ;;
          esac

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.COMPOSER_GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment and the scratch databases
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS pos_saas_rehearsal_testing; CREATE DATABASE IF NOT EXISTS pos_saas_dataset_testing; CREATE DATABASE IF NOT EXISTS pos_saas_concurrency_testing;"

      # Pest directly: `php artisan test` always adds --configuration=phpunit.xml
      # itself, and PHPUnit 12 refuses a second --configuration.
      - name: Test suite (MySQL 8)
        run: vendor/bin/pest --compact --configuration=phpunit.mysql.xml

  migration-rehearsal:
    name: Migration rehearsal on the live-like dataset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pos_saas_dataset_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Check the COMPOSER_GITHUB_TOKEN secret
        env:
          TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the repository secret COMPOSER_GITHUB_TOKEN (the token only, not JSON) so Composer can install the private wa-gateway-laravel package."
            exit 1
          fi
          case "$TOKEN" in
            *'{'*|*'"'*|*' '*)
              echo "::error::COMPOSER_GITHUB_TOKEN must contain only the token (ghp_... or github_pat_...), with no JSON, quotes or spaces."
              exit 1 ;;
          esac

      # The dataset is built with the base branch's code and schema when it has
      # dataset:build (stage 1a onwards); in stage 0 the base doesn't, so this
      # branch builds it and the rehearsal only proves the dataset loads.
      #
      # The mode says how the data reaches this branch's schema:
      #   import    the base is pre-SaaS: the baseline must refuse its database,
      #             and the data crosses by the one-off legacy import (the stage
      #             1a pull request);
      #   additive  the base already has the SaaS baseline (stage 1a merged):
      #             this branch's new migrations run on the dataset itself, and
      #             no table may lose rows.
      - name: Choose the code to build the dataset with
        id: base
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          if git cat-file -e "$BASE:app/Console/Commands/BuildDatasetCommand.php" 2>/dev/null; then
            git worktree add ../base "$BASE"
            echo "dir=../base" >> "$GITHUB_OUTPUT"
            echo "Building the dataset with $BASE"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "$BASE has no dataset:build yet; building with this branch"
          fi
          if git cat-file -e "$BASE:database/migrations/0001_01_01_000000_guard_empty_database.php" 2>/dev/null; then
            echo "mode=additive" >> "$GITHUB_OUTPUT"
            echo "$BASE has the SaaS baseline: rehearsing this branch's migrations on its dataset"
          else
            echo "mode=import" >> "$GITHUB_OUTPUT"
            echo "$BASE is pre-SaaS: rehearsing the baseline guard and the legacy import"
          fi

      - name: Install dependencies (dataset code)
        working-directory: ${{ steps.base.outputs.dir }}
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.COMPOSER_GITHUB_TOKEN }}"}}'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --ansi

      # Built with the base's code, so the data is what the base would hold.
      # When the base can't build it (a bug on the base that this branch may
      # be fixing), the next steps build it with this branch's code instead,
      # with a warning, so a fix is never blocked by the bug it fixes.
      - name: Build the live-like dataset
        id: build
        continue-on-error: true
        working-directory: ${{ steps.base.outputs.dir }}
        run: php artisan dataset:build --database=dataset_testing --scale=0.25

      - name: Install dependencies (this branch)
        if: steps.base.outputs.dir != '.'
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.COMPOSER_GITHUB_TOKEN }}"}}'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build the dataset with this branch instead
        if: steps.build.outcome == 'failure'
        run: |
          if [ "${{ steps.base.outputs.dir }}" = "." ] || [ "${{ steps.base.outputs.mode }}" = "import" ]; then
            echo "::error::The dataset could not be built (see the step above)."
            exit 1
          fi
          echo "::warning::The base branch's code could not build the dataset (see the failed step above); building it with this branch's code, so the rehearsal runs on data this branch wrote."
          mysql -h 127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS pos_saas_dataset_testing; CREATE DATABASE pos_saas_dataset_testing;"
          php artisan dataset:build --database=dataset_testing --scale=0.25

      - name: Count rows before migrating
        run: php artisan tinker --execute="require '.github/scripts/table-counts.php';" > /tmp/counts-before.json

      # Stage 1a rewrote the migrations into a clean SaaS baseline (decision
      # 4.7). Its first migration must refuse a database that already holds
      # data; the data is carried across by the legacy import instead.
      - name: The baseline refuses the dataset's database
        if: steps.base.outputs.mode == 'import'
        run: |
          if php artisan migrate --database=dataset_testing --no-interaction; then
            echo "::error::The baseline migrated over a database that already has tables; the empty-database guard should have refused it."
            exit 1
          fi
          echo "Refused, as it should be."

      - name: Build the baseline in an empty database
        if: steps.base.outputs.mode == 'import'
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE pos_saas_import_testing"
          php artisan migrate --database=import_testing --no-interaction

      # The data crosses by the one-off import (stage 1a): the dataset, built
      # with the base branch's code, goes into the baseline as one business.
      # The command verifies counts, money totals, credit balances, stock and
      # references, and fails on any mismatch.
      - name: Import the dataset into the baseline
        if: steps.base.outputs.mode == 'import'
        run: php artisan saas:import-legacy --from=dataset_testing --database=import_testing --business-name="Live-like Retail"

      - name: Upload the import report
        if: always() && steps.base.outputs.mode == 'import'
        uses: actions/upload-artifact@v4
        with:
          name: import-report
          path: storage/app/imports/
          if-no-files-found: ignore

      # The import only reads its source: the dataset must be untouched.
      - name: Check the dataset is unchanged
        if: steps.base.outputs.mode == 'import'
        run: |
          php artisan tinker --execute="require '.github/scripts/table-counts.php';" > /tmp/counts-after.json
          php -r '
            $before = json_decode(file_get_contents("/tmp/counts-before.json"), true);
            $after = json_decode(file_get_contents("/tmp/counts-after.json"), true);
            if ($before !== $after) { fwrite(STDERR, "The dataset changed during the rehearsal.\n"); exit(1); }
            echo count($before)." tables, ".array_sum($before)." rows, unchanged.\n";
          '

      # After stage 1a, schema changes are additive migrations that carry the
      # data across (the migrations check their own totals, e.g. stock moved
      # into shop_variation). Run them on the dataset built with the base.
      - name: Run this branch's migrations on the dataset
        if: steps.base.outputs.mode == 'additive'
        run: php artisan migrate --database=dataset_testing --no-interaction

      # Live-data rule: a migration may add rows (registers, cost layers) but
      # never lose them, and never drop a table that held rows.
      - name: Check no table lost rows
        if: steps.base.outputs.mode == 'additive'
        run: |
          php artisan tinker --execute="require '.github/scripts/table-counts.php';" > /tmp/counts-after.json
          php -r '
            $before = json_decode(file_get_contents("/tmp/counts-before.json"), true);
            $after = json_decode(file_get_contents("/tmp/counts-after.json"), true);
            $lost = [];
            foreach ($before as $table => $rows) {
              if (! array_key_exists($table, $after)) {
                if ($rows > 0) { $lost[] = "$table dropped with $rows rows"; }
              } elseif ($after[$table] < $rows) {
                $lost[] = "$table: $rows -> {$after[$table]}";
              }
            }
            if ($lost !== []) { fwrite(STDERR, "Rows lost:\n  ".implode("\n  ", $lost)."\n"); exit(1); }
            echo count($before)." tables, ".array_sum($before)." rows before, ".array_sum($after)." after; none lost.\n";
          '
